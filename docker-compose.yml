# Production stack — Next.js app behind Caddy (auto-HTTPS), Postgres, Adminer.
#   docker compose up -d --build
#
# Public surface is ONLY Caddy (80/443). app + db are internal to the Docker
# network; Adminer is bound to localhost (reach it via an SSH tunnel).
#
# Requires in .env: DOMAIN, ACME_EMAIL, POSTGRES_*, SMTP_*, ADMIN_PASSWORD,
# REWARDS_SECRET, OPERATOR_SESSION_SECRET, CRON_SECRET.
# Optional: R2_* (Cloudflare R2 for operator photos; without it photos are kept
# in the `uploads` volume).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Scripts here run once on first init, in filename order.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: applies db/migrations (tracked, idempotent) then exits.
  # `app` waits for it, so a failed migration blocks the deploy with clear
  # logs instead of putting the app in a restart loop.
  #   docker compose run --rm migrate      (re-run manually any time; safe)
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      NODE_ENV: production
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      TEAM_EMAIL: ${TEAM_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REWARDS_SECRET: ${REWARDS_SECRET:-}
      OPERATOR_SESSION_SECRET: ${OPERATOR_SESSION_SECRET:-}
      CRON_SECRET: ${CRON_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  adminer:
    image: adminer:4
    restart: unless-stopped
    # localhost-only: reach via SSH tunnel  ->  ssh -L 8080:localhost:8080 ...
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  db_data:
  uploads:
  caddy_data:
  caddy_config:
